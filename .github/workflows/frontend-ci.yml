name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present
      - name: Unit tests
        working-directory: frontend
        run: node --test src/config/api.test.mjs
      # Blocking: expo-doctor is what catches packages drifting away from the
      # Expo SDK's pinned versions (the Nov 2026 react-native 0.86 merge).
      - name: Expo doctor
        working-directory: frontend
        run: npx --yes expo-doctor@1.21.6
