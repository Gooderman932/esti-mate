name: EAS Preview Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-preview.yml'

jobs:
  preview:
    name: EAS preview build (Android APK)
    runs-on: ubuntu-latest
    # `secrets` is not available in job-level `if`, so the token check runs as a step.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Expo CLI + eas-cli
        run: npm i -g eas-cli @expo/cli
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build preview (Android)
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile preview --platform android --non-interactive --no-wait
