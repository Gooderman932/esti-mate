name: EAS Production Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [android, ios, all]
        default: android

jobs:
  production:
    runs-on: ubuntu-latest
    # `secrets` is not available in job-level `if`, so the token check runs as a step.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Expo CLI + eas-cli
        run: npm i -g eas-cli @expo/cli
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build production
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile production --platform ${{ github.event.inputs.platform }} --non-interactive --no-wait
